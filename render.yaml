# Render deployment for the plan reader's API.
#
# Render reads this file from the repository root and creates the service from
# it. The interface itself is deployed separately on Vercel; this is only the
# API behind it.
services:
  - type: web
    name: loopsite-plan-reader-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Character recognition needs more memory than the free instance has. On a
    # free instance, build with BUILD_WITH_OCR=false instead: sheets that carry
    # their own text still read in full.
    plan: starter
    healthCheckPath: /api/plan/health
    envVars:
      # The address of the deployed interface. Set this to the Vercel URL once
      # it exists — several may be listed, separated by commas, so a preview
      # deployment and the live one are both allowed.
      - key: ALLOWED_ORIGINS
        sync: false
      # The interface and the API are on different domains, so the session
      # cookie needs SameSite=None with Secure. Without this the cookie is
      # silently dropped and nobody can see the plan they just uploaded.
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      # How many plans this instance reads at the same time, and how many may
      # queue behind them. Reading two at once on a small instance is how it
      # runs out of memory and is killed, which loses every plan on it — the
      # ones being read and the ones people were only looking at.
      - key: MAX_CONCURRENT_READINGS
        value: "1"
      - key: MAX_WAITING_READINGS
        value: "4"
